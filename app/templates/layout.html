<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ title or 'Almatı Eğitim Ataşeliği | Kurs Takip Otomasyonu' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="app-body">
  {% if current_user.is_authenticated %}
  <div class="relative min-h-screen">
    {% include 'partials/sidebar.html' %}
    <div class="lg:pl-64">
      {% include 'partials/topbar.html' %}
      <main class="px-6 pb-16 pt-6">
        {% include 'partials/flash.html' %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% else %}
    {% block auth %}{% endblock %}
  {% endif %}
  {% include 'partials/assistant_widget.html' %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
