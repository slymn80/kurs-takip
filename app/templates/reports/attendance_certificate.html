{% extends 'layout.html' %}
{% block content %}
<div class="section-header mb-6">
  <div>
    <p class="section-kicker">Sertifikalar</p>
    <h2 class="font-display text-2xl">Katılım Belgesi</h2>
    <p class="section-subtitle">Alanları doldurun ve tek tıkla Word belgesini indirin.</p>
  </div>
</div>

<div class="max-w-2xl">
  <div class="card p-6 space-y-3">
    <div>
      <label class="label">Kursiyer Adı Soyadı</label>
      <input id="f-student" class="input" type="text" value="{{ data.student_full_name or '' }}">
    </div>
    <div>
      <label class="label">Saat Sayısı</label>
      <input id="f-hours" class="input" type="text" value="{{ data.hours_count or '' }}">
    </div>
    <div>
      <label class="label">Düzey</label>
      <input id="f-level" class="input" type="text" value="{{ data.level or '' }}">
    </div>
    <div>
      <label class="label">Tarih</label>
      <input id="f-date" class="input" type="text" value="{{ data.cert_date or '' }}" placeholder="dd.mm.yyyy">
    </div>
    <div>
      <label class="label">Kurs Eğitmeni</label>
      <input id="f-instructor" class="input" type="text" value="{{ data.instructor_name or '' }}">
    </div>
    <div class="pt-2">
      <a id="docx-link" class="btn-primary w-full justify-center" href="#">Word İndir</a>
    </div>
  </div>
</div>

<script>
  (function() {
    const fields = {
      student_full_name: document.getElementById("f-student"),
      hours_count: document.getElementById("f-hours"),
      level: document.getElementById("f-level"),
      cert_date: document.getElementById("f-date"),
      instructor_name: document.getElementById("f-instructor")
    };

    const docxLink = document.getElementById("docx-link");

    const sync = () => {
      const params = new URLSearchParams();
      Object.keys(fields).forEach((key) => {
        const value = (fields[key].value || "").trim();
        if (value) params.set(key, value);
      });

      const qs = params.toString();
      docxLink.href = "{{ url_for('reports.attendance_certificate_docx') }}" + (qs ? `?${qs}` : "");
    };

    Object.values(fields).forEach((el) => {
      el.addEventListener("input", sync);
      el.addEventListener("change", sync);
    });

    sync();
  })();
</script>
{% endblock %}
