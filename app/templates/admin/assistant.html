{% extends 'layout.html' %}
{% block content %}
<div class="space-y-6">
  <div class="card p-6">
    <h1 class="font-display text-2xl mb-2">Asistan Promptu</h1>
    <p class="text-ink-500 text-sm">Asistanın tek bilgi kaynağı bu prompt alanıdır. Oturumlu/oturumsuz tüm yanıtlar burada tanımlanan kurallara göre üretilir.</p>
  </div>

  <form method="post" class="card p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="save_prompt">

    <div>
      <label class="label">Sistem Promptu (Tek Kaynak)</label>
      <textarea name="assistant_prompt" class="textarea" rows="18">{{ assistant_prompt }}</textarea>
      <p class="text-xs text-ink-400 mt-1">Asistan tüm yanıtlarını yalnızca bu alana göre verir.</p>
    </div>

    <div class="flex justify-end">
      <button class="btn-primary">Promptu Kaydet</button>
    </div>
  </form>
</div>
{% endblock %}
