{% extends 'layout.html' %}
{% block content %}
<h2 class="font-display text-2xl mb-4">Denetim Logları</h2>
<div class="card p-6">
  <table class="table">
    <thead><tr><th>Tarih</th><th>İşlem</th><th>Tip</th><th>Kullanıcı</th></tr></thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td data-local-time="{{ log.created_at.isoformat() }}Z"></td>
        <td>{{ log.action }}</td>
        <td>{{ log.entity_type }}</td>
        <td>{{ log.actor_user_id }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
