<header class="app-topbar flex items-center justify-between px-6 py-4">

    <button class="lg:hidden" data-toggle-sidebar>
      <span class="text-ink-500">Menü</span>
    </button>
    <div>
      <p class="text-xs text-ink-400">Hoş geldin</p>
      <p class="font-semibold">{{ current_user.full_name }}</p>
    </div>
  </div>
  <div class="flex items-center gap-4">

      <div id="app-clock" class="font-semibold text-sm">--.--.---- --:--:--</div>
    </div>

  </div>
</header>
