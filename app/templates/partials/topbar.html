<header class="app-topbar flex items-center justify-between px-6 py-4">
  <div class="flex items-center gap-4">
    <button class="lg:hidden" data-toggle-sidebar>
      <span class="text-ink-500">Menü</span>
    </button>
    <img
      src="{{ url_for('static', filename='branding/ataselik-logo.jpeg') }}"
      alt="Almatı Eğitim Ataşeliği Logosu"
      class="object-contain"
      style="width: 56px; height: 56px;"
    >
    <div>
      <p class="text-xs text-ink-400">Hoş geldin</p>
      <p class="font-semibold">{{ current_user.full_name }}</p>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <div class="text-right">
      <div id="app-clock" class="font-semibold text-sm">--.--.---- --:--:--</div>
    </div>
    <div class="flex flex-col items-center gap-1">
      {% if current_user.role == 'attache' %}
        <div class="text-xs text-ink-500 text-center">{{ current_user.full_name }}</div>
      {% endif %}
      <span class="badge role-pill">{{ current_user.role }}</span>
    </div>
  </div>
</header>
