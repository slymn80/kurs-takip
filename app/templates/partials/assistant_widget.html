<div id="login-assistant" class="fixed bottom-5 right-5 z-50">
  <button id="assistant-toggle" type="button" class="group inline-flex items-center gap-3 rounded-full border border-ink-100 bg-white px-3 py-2 shadow-lg transition-transform hover:-translate-y-0.5 hover:shadow-xl">
    <span class="relative inline-flex h-10 w-10 items-center justify-center rounded-full bg-brand text-white shadow-md overflow-hidden">
      <span class="absolute -top-0.5 -right-0.5 h-3 w-3 rounded-full border border-white bg-emerald-500"></span>
      <img src="{{ url_for('static', filename='branding/turk_kazak_co.jpg') }}" alt="YZ Asistan" style="width:100%;height:100%;object-fit:cover;border-radius:9999px;">
    </span>
    <span class="flex flex-col text-left leading-tight">
      <span class="text-[11px] uppercase tracking-wide text-ink-400">YZ 7/24</span>
      <span class="text-sm font-semibold text-ink-700">Asistan</span>
    </span>
  </button>
  <div id="assistant-panel" class="card p-4 mt-3 w-96 hidden">
    <div class="flex items-center justify-between mb-3">
      <h3 id="assistant-title" class="font-display text-lg">Kurs Asistanı</h3>
      <button id="assistant-close" type="button" class="btn-secondary btn-sm">Kapat</button>
    </div>
    <div id="assistant-lang" class="mb-3 flex items-center gap-1">
      <button type="button" data-lang="tr" class="assistant-lang-btn btn-secondary btn-sm">TR</button>
      <button type="button" data-lang="kz" class="assistant-lang-btn btn-secondary btn-sm">KZ</button>
      <button type="button" data-lang="ru" class="assistant-lang-btn btn-secondary btn-sm">RU</button>
      <button type="button" data-lang="en" class="assistant-lang-btn btn-secondary btn-sm">EN</button>
    </div>
    <div id="assistant-messages" class="border border-ink-100 rounded-xl p-3 h-64 overflow-y-auto bg-white text-sm space-y-2"></div>
    <form id="assistant-form" class="mt-3 space-y-2">
      <input id="assistant-input" class="input" maxlength="1200" placeholder="Sorunuzu yazın..." autocomplete="off">
      <button id="assistant-submit" class="btn-primary w-full" type="submit">Gönder</button>
    </form>
    <p id="assistant-note" class="text-xs text-ink-400 mt-2">Türkçe kurs süreçleri hakkında bilgi verir.</p>
  </div>
</div>
<script>
  (function () {
    const toggleBtn = document.getElementById("assistant-toggle");
    const closeBtn = document.getElementById("assistant-close");
    const panel = document.getElementById("assistant-panel");
    const form = document.getElementById("assistant-form");
    const input = document.getElementById("assistant-input");
    const messagesEl = document.getElementById("assistant-messages");
    const titleEl = document.getElementById("assistant-title");
    const submitEl = document.getElementById("assistant-submit");
    const noteEl = document.getElementById("assistant-note");
    const langButtons = Array.from(document.querySelectorAll(".assistant-lang-btn"));
    const csrfMeta = document.querySelector('meta[name="csrf-token"]');
    const csrfToken = csrfMeta ? csrfMeta.getAttribute("content") : "";
    const history = [];
    let selectedLang = "tr";
    const greetings = {
      tr: "Merhaba, Türkçe kurslar ve başvuru süreçleri için yardımcı olabilirim.",
      kz: "Сәлем! Түрік тілі курстары мен тіркеу үдерісі бойынша көмектесе аламын.",
      ru: "Здравствуйте! Я помогу по курсам турецкого языка и процессу регистрации.",
      en: "Hello! I can help with Turkish course and registration processes."
    };
    const uiText = {
      tr: {
        title: "Kurs Asistanı",
        close: "Kapat",
        placeholder: "Sorunuzu yazın...",
        submit: "Gönder",
        note: "Türkçe kurs süreçleri hakkında bilgi verir.",
        typing: "Yazıyor...",
        noReply: "Şu anda yanıt üretilemedi.",
        fallback: "Asistan şu anda kullanılamıyor. Lütfen tekrar deneyin."
      },
      kz: {
        title: "Курс көмекшісі",
        close: "Жабу",
        placeholder: "Сұрағыңызды жазыңыз...",
        submit: "Жіберу",
        note: "Түрік тілі курстарының үдерістері туралы ақпарат береді.",
        typing: "Жауап жазып жатыр...",
        noReply: "Қазір жауап құру мүмкін болмады.",
        fallback: "Көмекші қазір қолжетімсіз. Қайта көріңіз."
      },
      ru: {
        title: "Ассистент курсов",
        close: "Закрыть",
        placeholder: "Напишите ваш вопрос...",
        submit: "Отправить",
        note: "Помогает по процессам курсов турецкого языка.",
        typing: "Печатает...",
        noReply: "Сейчас не удалось сформировать ответ.",
        fallback: "Ассистент сейчас недоступен. Попробуйте снова."
      },
      en: {
        title: "Course Assistant",
        close: "Close",
        placeholder: "Type your question...",
        submit: "Send",
        note: "Provides information about Turkish course processes.",
        typing: "Typing...",
        noReply: "Could not generate a response right now.",
        fallback: "Assistant is currently unavailable. Please try again."
      }
    };

    if (!toggleBtn || !panel || !form || !input || !messagesEl) {
      return;
    }

    const addMessage = (role, text) => {
      const item = document.createElement("div");
      item.className = role === "user"
        ? "ml-8 rounded-lg bg-ink-50 p-2 text-ink-700 whitespace-pre-line"
        : "mr-8 rounded-lg bg-brand-50 p-2 text-ink-700 whitespace-pre-line";
      item.textContent = text;
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    addMessage("assistant", greetings[selectedLang] || greetings.tr);

    const syncUiText = () => {
      const t = uiText[selectedLang] || uiText.tr;
      if (titleEl) titleEl.textContent = t.title;
      if (closeBtn) closeBtn.textContent = t.close;
      if (input) input.placeholder = t.placeholder;
      if (submitEl) submitEl.textContent = t.submit;
      if (noteEl) noteEl.textContent = t.note;
      const firstAssistant = messagesEl.firstElementChild;
      if (firstAssistant && !history.length) {
        firstAssistant.textContent = greetings[selectedLang] || greetings.tr;
      }
    };

    const syncLangButtons = () => {
      langButtons.forEach((btn) => {
        if (btn.getAttribute("data-lang") === selectedLang) {
          btn.classList.add("btn-primary");
          btn.classList.remove("btn-secondary");
        } else {
          btn.classList.add("btn-secondary");
          btn.classList.remove("btn-primary");
        }
      });
    };
    syncUiText();
    syncLangButtons();
    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedLang = btn.getAttribute("data-lang") || "tr";
        syncUiText();
        syncLangButtons();
      });
    });

    toggleBtn.addEventListener("click", () => panel.classList.toggle("hidden"));
    closeBtn.addEventListener("click", () => panel.classList.add("hidden"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = (input.value || "").trim();
      if (!message) return;

      input.value = "";
      addMessage("user", message);
      history.push({ role: "user", content: message });
      addMessage("assistant", (uiText[selectedLang] || uiText.tr).typing);
      const typingEl = messagesEl.lastElementChild;

      try {
        const response = await fetch("{{ url_for('auth.login_assistant_chat') }}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
          },
          body: JSON.stringify({
            message: message,
            history: history,
            lang: selectedLang
          })
        });
        const data = await response.json();
        const reply = data.reply || (uiText[selectedLang] || uiText.tr).noReply;
        typingEl.textContent = reply;
        history.push({ role: "assistant", content: reply });
      } catch (_error) {
        typingEl.textContent = (uiText[selectedLang] || uiText.tr).fallback;
      }
    });
  })();
</script>
