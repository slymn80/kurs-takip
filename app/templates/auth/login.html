{% extends 'layout.html' %}
{% block auth %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-ink-50 via-white to-ink-100">
  <div class="card w-full max-w-md p-8">
    <h1 class="font-display text-3xl mb-4">Kurs Takip</h1>
    <p class="text-ink-500 mb-6">Almatı Eğitim Ataşeliği</p>
    <form method="post" class="space-y-4">
      {{ form.hidden_tag() }}
      <div>
        <label class="label">Kullanıcı Adı</label>
        {{ form.username(class_='input') }}
      </div>
      <div>
        <label class="label">Şifre</label>
        {{ form.password(class_='input') }}
      </div>
      <button class="btn-primary w-full">Giriş</button>
    </form>
    {% include 'partials/flash.html' %}
  </div>
</div>
{% endblock %}
