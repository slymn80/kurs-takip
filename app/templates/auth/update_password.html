{% extends 'layout.html' %}
{% block content %}
<div class="max-w-md">
  <h2 class="font-display text-xl mb-4">Şifre Değiştir</h2>
  <form method="post" class="card p-6 space-y-3">
    {{ form.hidden_tag() }}
    <div>
      <label class="label">Mevcut Şifre</label>
      {{ form.current_password(class_='input') }}
    </div>
    <div>
      <label class="label">Yeni Şifre</label>
      {{ form.new_password(class_='input') }}
    </div>
    <div>
      <label class="label">Yeni Şifre (Tekrar)</label>
      {{ form.confirm_password(class_='input') }}
    </div>
    <button class="btn-primary">Şifreyi Güncelle</button>
  </form>
</div>
{% endblock %}
