{% extends 'layout.html' %}
{% block content %}
<div class="max-w-xl">
  <h2 class="font-display text-2xl mb-4">İlk Giriş: Şifre Değiştir</h2>
  <form method="post" class="space-y-4 card p-6">
    {{ form.hidden_tag() }}
    <div>
      <label class="label">Yeni Şifre</label>
      {{ form.password(class_='input') }}
    </div>
    <button class="btn-primary">Kaydet</button>
  </form>
</div>
{% endblock %}
